name: macOS verification

# The project uses macOS-only commands, plists, and Objective-C. Run its
# offline verification on macOS rather than linting zsh code as POSIX shell.

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline verification
        run: zsh tests/verify.sh
